services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: openspider
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  openspider:
    build: .
    ports:
      - "8088:8088"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: "123456"
      MYSQL_DATABASE: openspider
      API_PORT: 8088
      JWT_SECRET_KEY: "change-me-in-production-use-a-random-64-char-string"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./openspider/spiders:/app/openspider/spiders
      - ./logs:/app/logs
      - ./crawl_data:/app/crawl_data

volumes:
  mysql_data:
